<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>生产实时看板 · 手机版</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --green: #3fb950; --orange: #d29922; --red: #f85149; --gray: #8b949e;
    --white: #e6edf3; --blue: #58a6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background: linear-gradient(170deg,#0d1117 0%,#0a0e14 100%);
    background-attachment: fixed; color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

  /* ── 吸顶头部 ── */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13,17,23,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: 10px 12px 8px;
  }
  .h-top { display:flex; align-items:center; gap:8px; }
  .h-title { font-size:17px; font-weight:800; letter-spacing:.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .h-title small { color: var(--blue); font-size:10px; font-weight:600; margin-left:4px; vertical-align:2px; }
  .h-sub { display:flex; align-items:center; gap:8px; margin-top:3px; font-size:11px; color:var(--gray); }
  .h-sub .dot { width:7px; height:7px; border-radius:50%; background:var(--gray); display:inline-block; margin-right:4px; }
  .h-sub .dot.ok { background:var(--green); box-shadow:0 0 6px var(--green); }
  .h-sub .dot.bad { background:var(--red); box-shadow:0 0 6px var(--red); }
  .lang-btn {
    border:1px solid var(--border); background:var(--panel2); color:var(--white);
    border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .lang-btn:active { background:#263044; }

  /* ── 停滞横幅 ── */
  .stall-banner {
    display:none; margin:10px 12px 0; padding:9px 12px; border-radius:10px;
    background: rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.5); color:var(--red);
    font-size:13px; font-weight:700; animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity:.55; } }

  /* ── KPI 2×2 ── */
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .kpi {
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;
  }
  .kpi .lb { font-size:11px; color:var(--gray); font-weight:600; }
  .kpi .val { font-size:24px; font-weight:800; font-variant-numeric: tabular-nums; margin-top:2px; line-height:1.15; }
  .kpi .val.green { color:var(--green); } .kpi .val.red { color:var(--red); } .kpi .val.orange { color:var(--orange); }
  .kpi .val.blue { color:var(--blue); } .kpi .sub { font-size:10px; color:var(--gray); margin-top:2px; }

  /* ── 区块标题 ── */
  .sec {
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:12px; margin-bottom:12px;
  }
  .sec-h { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; font-weight:800; }
  .sec-h .tag { margin-left:auto; font-size:10px; color:var(--gray); font-weight:600; white-space:nowrap; }

  /* ── 线体卡片 ── */
  .line-card {
    background:var(--panel2); border:1px solid var(--border); border-radius:11px;
    padding:9px 11px; margin-bottom:7px;
  }
  .lc-top { display:flex; align-items:center; gap:7px; }
  .lc-name { font-size:14px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lc-status { font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; }
  .st-run { color:var(--green); background:rgba(63,185,80,.12); }
  .st-stop { color:var(--red); background:rgba(248,81,73,.12); }
  .st-idle { color:var(--gray); background:rgba(139,148,158,.12); }
  .lc-rate { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; text-align:right; min-width:74px; }
  .rate-ok { color:var(--green); } .rate-warn { color:var(--orange); } .rate-bad { color:var(--red); }
  .lc-mid { display:flex; gap:14px; margin-top:4px; font-size:11.5px; color:var(--gray); font-variant-numeric:tabular-nums; }
  .lc-mid b { color:var(--white); font-weight:700; }
  .lc-mid .cb.neg { color:var(--red); } .lc-mid .cb.pos { color:var(--green); }
  .bar { height:5px; border-radius:4px; background:#0d1117; margin-top:7px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; background:var(--gray); transition:width .5s; }
  .bar i.ok { background:var(--green); } .bar i.warn { background:var(--orange); } .bar i.bad { background:var(--red); }

  /* ── 问题点 ── */
  .prob-summary { font-size:12px; color:var(--gray); background:rgba(248,81,73,.07); border:1px solid rgba(248,81,73,.3); border-radius:9px; padding:7px 10px; margin-bottom:7px; }
  .prob-item { display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--border); font-size:12.5px; }
  .prob-item:last-child { border-bottom:none; }
  .prob-rank { width:18px; height:18px; border-radius:6px; font-size:11px; font-weight:800; text-align:center; line-height:18px; flex-shrink:0; }
  .r1 { background:rgba(248,81,73,.85); color:#fff; } .r2 { background:rgba(210,153,34,.85); color:#0d1117; } .r3 { background:rgba(139,148,158,.4); color:#fff; }
  .prob-txt { flex:1; min-width:0; }
  .prob-name { color:var(--white); font-weight:600; }
  .prob-imp { color:var(--red); font-weight:800; }
  .prob-meta { color:var(--gray); font-size:11px; margin-top:2px; }

  /* ── 表格 ── */
  table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--gray); font-size:10.5px; font-weight:700; padding:5px 6px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:6px; border-bottom:1px solid rgba(45,51,59,.5); }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; }
  .rate-ok { color:var(--green); } .rate-warn { color:var(--orange); } .rate-bad { color:var(--red); }

  /* ── 趋势 ── */
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px;
    border:1px solid var(--border); background:var(--panel2); color:var(--gray); cursor:pointer;
  }
  .chip.on { background:rgba(88,166,255,.15); border-color:var(--blue); color:var(--blue); }
  .chart-box { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:8px; }
  svg { display:block; width:100%; height:auto; }
  .chart-empty { color:var(--gray); font-size:12px; text-align:center; padding:22px 0; }

  /* ── 页脚 ── */
  footer { text-align:center; color:var(--gray); font-size:10.5px; margin-top:16px; line-height:1.8; }
  .refresh-btn {
    border:1px solid var(--border); background:var(--panel2); color:var(--white);
    border-radius:10px; padding:9px 0; width:100%; font-size:13px; font-weight:700; cursor:pointer; margin-top:10px;
  }
  .refresh-btn:active { background:#263044; }
  .src-line { margin-top:8px; }

  .empty { color:var(--gray); font-size:12px; padding:8px 0; }
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="h-title" id="title">🏭 生产实时看板 <small id="modeTag">LIVE</small></div>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
  <div class="h-sub">
    <span><span class="dot" id="connDot"></span><span id="connTxt">连接中…</span></span>
    <span id="dateTxt"></span>
    <span id="updTxt" style="margin-left:auto"></span>
  </div>
</header>

<div class="wrap">
  <div class="stall-banner" id="stallBanner">⚠️ <span id="stallTxt"></span></div>

  <div class="kpis">
    <div class="kpi"><div class="lb">⚡ 平均效率</div><div class="val" id="kpiEff">-</div><div class="sub">主要线体·计划量加权</div></div>
    <div class="kpi"><div class="lb">🏆 达成线体 ≥90%</div><div class="val" id="kpiHit">-</div><div class="sub" id="kpiHitSub">达成 x/8</div></div>
    <div class="kpi"><div class="lb">🔵 Final 产量</div><div class="val blue" id="kpiFinal">-</div><div class="sub">Final A-D 合计</div></div>
    <div class="kpi"><div class="lb">🟠 Motor 产量</div><div class="val orange" id="kpiMotor">-</div><div class="sub">Motor H/S/F/WL 合计</div></div>
  </div>

  <div class="sec">
    <div class="sec-h">🏭 主要线体 <span class="tag" id="otherTag"></span></div>
    <div id="mainLines"></div>
  </div>

  <div class="sec" id="probSec" style="display:none">
    <div class="sec-h">🚨 未达成原因 · 主要问题点 <span class="tag" id="probSrc">-</span></div>
    <div id="probBody"></div>
  </div>

  <div class="sec" id="fhSec" style="display:none">
    <div class="sec-h">⏰ 首小时达成 (8-9点)</div>
    <div id="fhBody"></div>
  </div>

  <div class="sec" id="attSec" style="display:none">
    <div class="sec-h">👥 出勤率 <span class="tag" id="attTag"></span></div>
    <div id="attBody"></div>
  </div>

  <div class="sec">
    <div class="sec-h">📈 达成率趋势 <span class="tag" id="trendTag">近10个工作日</span></div>
    <div class="chips" id="trendChips"></div>
    <div class="chart-box"><div id="trendChart"></div></div>
  </div>

  <div class="sec" id="othSec" style="display:none">
    <div class="sec-h">📊 其他线体 <span class="tag" id="othTag">-</span></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>线体</th><th class="num">实际</th><th class="num">计划</th><th class="num">差异</th><th class="num">达成率</th></tr></thead>
        <tbody id="othBody"></tbody>
      </table>
    </div>
  </div>

  <button class="refresh-btn" id="refreshBtn">🔄 手动刷新</button>
  <footer>
    <div class="src-line" id="srcLine"></div>
    <div>手机版 · 数据每 60 秒自动刷新</div>
  </footer>
</div>

<!-- 跨仓库加载: 问题点/首小时/历史达成率 (由电脑端 cron 定时写入 pdtiii-live 仓库) -->
<script src="https://wlp713.github.io/pdtiii-live/live-data.js?v=mobile"></script>
<script>
(function () {
  "use strict";
  var zh = true;
  var MAIN_LINES = ["Final A line","Final B Line","Final C line","Final D line","Motor H-Series","Motor S-Series","Motor F-Series","Motor WL"];
  function normName(n){ return String(n||"").toLowerCase().replace(/\s+/g,""); }
  var MAIN_SET = {};
  MAIN_LINES.forEach(function(l){ MAIN_SET[normName(l)] = true; });

  var DATA_URL = "https://dm111-e8a7d-default-rtdb.firebaseio.com/pdtiii.json";
  var ATT_URL  = "https://dm111-e8a7d-default-rtdb.firebaseio.com/pdtiii_att.json";

  var state = { lines: [], updatedAt: null };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(n){ if(n===null||n===undefined||isNaN(n)) return "-"; return Number(n).toLocaleString("en-US"); }
  function fmt1(n){ if(n===null||n===undefined||isNaN(n)) return "-"; return Number(n).toFixed(1); }
  function shortName(n){ return String(n||"").replace(/ line$/i,"").replace(/-Series$/i,"").trim(); }
  function rateCls(r){ if(r===null||r===undefined||isNaN(r)) return ""; return r>=90?"rate-ok":(r>=70?"rate-warn":"rate-bad"); }
  function T(zhTxt, enTxt){ return zh ? zhTxt : enTxt; }

  /* ── 语言 ── */
  function applyLang(){
    $("title").innerHTML = (zh?"🏭 生产实时看板":"🏭 Production Board") + " <small>" + (zh?"手机版":"MOBILE") + "</small>";
    $("langBtn").textContent = zh ? "EN" : "中";
    $("kpiHitSub").textContent = zh ? "达成 x/8" : "hit x/8";
    $("otherTag").textContent = zh ? "其他线体明细见下方" : "other lines below";
    $("refreshBtn").textContent = zh ? "🔄 手动刷新" : "🔄 Refresh";
    document.title = zh ? "生产实时看板 · 手机版" : "Production Board · Mobile";
  }

  /* ── 主数据拉取 (Firebase) ── */
  function fetchJSON(url){
    return fetch(url + "?t=" + Date.now(), { signal: AbortSignal.timeout(10000) })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .catch(function(){ return null; });
  }

  function render(){
    var lines = state.lines || [];
    if (!lines.length) return;
    var mains = [], others = [];
    lines.forEach(function(l){
      var k = normName(l.name);
      if (MAIN_SET[k]) mains.push(l); else others.push(l);
    });
    renderKpis(mains, lines);
    renderMain(mains);
    renderOthers(others);
    renderStall(lines);
    renderProblems();
    renderFirstHour();
    renderAttendance();
    renderTrend();
    updText();
  }

  function renderKpis(mains, all){
    var wEff = 0, wPlan = 0;
    mains.forEach(function(l){
      var p = Number(l.plan)||0, e = Number(l.eff);
      if (p>0 && !isNaN(e)){ wEff += e*p; wPlan += p; }
    });
    var avg = wPlan>0 ? (wEff/wPlan) : NaN;
    $("kpiEff").textContent = isNaN(avg) ? "-" : avg.toFixed(1)+"%";
    $("kpiEff").className = "val " + (isNaN(avg) ? "" : (avg>=90?"green":(avg>=70?"orange":"red")));
    var hit = mains.filter(function(l){ return Number(l.eff)>=90; }).length;
    $("kpiHit").textContent = hit + "/" + mains.length;
    $("kpiHit").className = "val " + (hit>=6?"green":(hit>=4?"orange":"red"));
    var fin = 0, mot = 0;
    mains.forEach(function(l){
      var n = normName(l.name), v = Number(l.actual)||0;
      if (n.indexOf("final")===0) fin += v;
      if (n.indexOf("motor")===0) mot += v;
    });
    $("kpiFinal").textContent = fmt(fin);
    $("kpiMotor").textContent = fmt(mot);
  }

  function renderMain(mains){
    var box = $("mainLines"), h = "";
    mains.forEach(function(l, i){
      var e = Number(l.eff), r = Number(l.actual)||0, p = Number(l.plan)||0, cb = Number(l.cb);
      var rc = rateCls(e);
      var pct = p>0 ? Math.min(100, Math.max(0, r/p*100)) : 0;
      var barCls = e>=90?"ok":(e>=70?"warn":"bad");
      var st = String(l.status||"").toUpperCase();
      var stCls = "st-idle", stTxt = l.status || "-";
      if (st.indexOf("RUN")>=0){ stCls="st-run"; stTxt = zh?"运行":"RUN"; }
      else if (st.indexOf("STOP")>=0 || st.indexOf("DOWN")>=0){ stCls="st-stop"; stTxt = zh?"停止":"STOP"; }
      else if (st.indexOf("IDLE")>=0){ stCls="st-idle"; stTxt = zh?"待机":"IDLE"; }
      var cbHtml = isNaN(cb) ? "-" : ((cb<0?"":"+") + fmt(cb));
      var cbCls = isNaN(cb) ? "" : (cb<0?"neg":"pos");
      h += '<div class="line-card">'
        + '<div class="lc-top"><div class="lc-name">' + esc(shortName(l.name)) + '</div>'
        + '<span class="lc-status ' + stCls + '">' + stTxt + '</span>'
        + '<div class="lc-rate ' + rc + '">' + (isNaN(e)?"-":e.toFixed(1)+"%") + '</div></div>'
        + '<div class="lc-mid"><span>' + T("实际","Act") + ' <b>' + fmt(r) + '</b></span>'
        + '<span>' + T("计划","Plan") + ' <b>' + fmt(p) + '</b></span>'
        + '<span>' + T("差异","Gap") + ' <b class="cb ' + cbCls + '">' + cbHtml + '</b></span></div>'
        + '<div class="bar"><i class="' + barCls + '" style="width:' + pct.toFixed(1) + '%"></i></div>'
        + '</div>';
    });
    box.innerHTML = h;
  }

  function renderOthers(others){
    var sec = $("othSec"), body = $("othBody");
    if (!others.length){ sec.style.display = "none"; return; }
    others.sort(function(a,b){ return (Number(b.eff)||-1)-(Number(a.eff)||-1); });
    sec.style.display = "block";
    $("othTag").textContent = others.length + " " + T("条","lines");
    body.innerHTML = others.map(function(l){
      var e = Number(l.eff), cb = Number(l.cb);
      return "<tr><td>" + esc(shortName(l.name)) + "</td>"
        + "<td class='num'>" + fmt(l.actual) + "</td>"
        + "<td class='num'>" + fmt(l.plan) + "</td>"
        + "<td class='num " + (isNaN(cb)?"":(cb<0?"rate-bad":"rate-ok")) + "'>" + (isNaN(cb)?"-":fmt(cb)) + "</td>"
        + "<td class='num " + rateCls(e) + "'>" + (isNaN(e)?"-":e.toFixed(1)+"%") + "</td></tr>";
    }).join("");
  }

  function renderStall(lines){
    var stalls = lines.filter(function(l){ return l.stalled; });
    var b = $("stallBanner");
    if (!stalls.length){ b.style.display="none"; return; }
    b.style.display = "block";
    $("stallTxt").textContent = (zh?"停滞线体: ":"Stalled: ") + stalls.map(function(l){ return shortName(l.name); }).join("、");
  }

  /* ── 问题点 (live-data.js) ── */
  function renderProblems(){
    var ld = window.__LIVE_DATA__ || {};
    var top = ld.problems_top || [];
    var problems = ld.problems || [];
    var sec = $("probSec"), body = $("probBody");
    if (!top.length){ sec.style.display="none"; return; }
    sec.style.display = "block";
    var totalImpact = problems.reduce(function(s,p){ return s + (Number(p.impact)||0); }, 0);
    var times = problems.map(function(p){ return Number(p.time); }).filter(function(t){ return !isNaN(t); }).sort(function(a,b){ return a-b; });
    var period = times.length ? (fmtTime(times[0]) + " ~ " + fmtTime(times[times.length-1])) : (zh?"全天":"all day");
    $("probSrc").textContent = T("AI分组","AI") + " " + top.length + "/" + problems.length + " · " + period;
    body.innerHTML = '<div class="prob-summary">📋 ' + period + ' · ' + T("共","") + problems.length + T("条 · 累计影响"," items · impact") + ' <b class="prob-imp">-' + Math.abs(totalImpact) + T("台"," pcs") + '</b></div>'
      + top.map(function(item, bi){
        var bname = (item.lines && item.lines.length) ? String(item.lines.join("、")) : "-";
        var dispName = (!zh && item.name_th) ? item.name_th : (item.name || "");
        var imp = (item.total_impact != null) ? " <b class='prob-imp'>" + (Number(item.total_impact)<=0?"":"+") + Number(item.total_impact) + T("台","") + "</b>" : "";
        var cnt = item.count > 1 ? " · ×" + item.count + T("时段","") : "";
        var timesStr = (item.times && item.times.length) ? " · " + item.times.map(esc).join("·") : "";
        return '<div class="prob-item"><div class="prob-rank r' + (bi+1) + '">' + (bi+1) + '</div>'
          + '<div class="prob-txt"><div class="prob-name">' + esc(bname) + '</div>'
          + '<div class="prob-meta">' + esc(dispName) + imp + cnt + timesStr + '</div></div></div>';
      }).join("");
  }
  function fmtTime(t){
    if (t===null||t===undefined) return "";
    var s = String(t);
    if (s.length===1) return "0"+s+":00";
    if (s.length===2) return s+":00";
    return s;
  }

  /* ── 首小时达成 (live-data.js) ── */
  function renderFirstHour(){
    var ld = window.__LIVE_DATA__ || {};
    var fh = ld.first_hour || [];
    var sec = $("fhSec"), body = $("fhBody");
    if (!fh.length){ sec.style.display="none"; return; }
    sec.style.display = "block";
    body.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>' + T("线体","Line") + '</th><th class="num">' + T("目标","Tgt") + '</th><th class="num">' + T("实际","Act") + '</th><th class="num">' + T("达成率","Rate") + '</th></tr></thead><tbody>'
      + fh.map(function(e){
        var r = Number(e.rate);
        return "<tr><td>" + esc(e.line || e.ws || "-") + "</td><td class='num'>" + (e.target!=null?e.target:"-") + "</td><td class='num'>" + (e.actual!=null?e.actual:"-") + "</td><td class='num " + rateCls(r) + "'>" + (isNaN(r)?"-":r.toFixed(1)+"%") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  /* ── 出勤率 (Firebase pdtiii_att) ── */
  var attData = null;
  function renderAttendance(){
    var sec = $("attSec"), body = $("attBody");
    var att = attData;
    if (!att || !att.rows || !att.rows.length){ sec.style.display="none"; return; }
    sec.style.display = "block";
    $("attTag").textContent = (att.date || "") + " " + T("已录入","entered");
    body.innerHTML = '<table><thead><tr><th>' + T("车间","WS") + '</th><th class="num">' + T("出勤率","Rate") + '</th></tr></thead><tbody>'
      + att.rows.map(function(r){
        var rate = parseFloat(r.rate);
        return "<tr><td>" + esc(r.ws||"-") + "</td><td class='num " + rateCls(rate) + "'>" + (isNaN(rate)?"-":rate.toFixed(0)+"%") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  /* ── 趋势 (__HISTORY__) ── */
  var trendSel = null;
  function getHistory(){
    var h = window.__HISTORY__;
    if (!Array.isArray(h)) return [];
    return h.slice(-10);
  }
  function renderTrend(){
    var hist = getHistory();
    var box = $("trendChart"), chipsBox = $("trendChips");
    if (!hist.length){ box.innerHTML = '<div class="chart-empty">' + T("暂无历史数据","No history data") + '</div>'; chipsBox.innerHTML=""; return; }
    // 收集线体 (出现次数>=2)
    var cnt = {};
    hist.forEach(function(d){ Object.keys(d.lines||{}).forEach(function(n){ cnt[n]=(cnt[n]||0)+1; }); });
    var names = Object.keys(cnt).filter(function(n){ return cnt[n]>=2; }).sort(function(a,b){
      var ia = MAIN_LINES.indexOf(a), ib = MAIN_LINES.indexOf(b);
      if (ia>=0 && ib>=0) return ia-ib;
      if (ia>=0) return -1;
      if (ib>=0) return 1;
      return a.localeCompare(b);
    });
    if (!names.length) names = Object.keys(cnt);
    if (!trendSel || names.indexOf(trendSel)<0) trendSel = names[0] || null;
    if (!trendSel){ box.innerHTML='<div class="chart-empty">-</div>'; return; }
    chipsBox.innerHTML = names.map(function(n){
      return '<span class="chip' + (n===trendSel?" on":"") + '" data-n="' + esc(n) + '">' + esc(shortName(n)) + '</span>';
    }).join("");
    Array.prototype.forEach.call(chipsBox.querySelectorAll(".chip"), function(c){
      c.addEventListener("click", function(){ trendSel = c.getAttribute("data-n"); renderTrend(); });
    });
    drawTrendChart(box, hist, trendSel);
  }
  function drawTrendChart(box, hist, name){
    var W = 340, H = 150, padL = 30, padR = 8, padT = 10, padB = 20;
    var pts = hist.map(function(d){ return { date: d.date, v: Number((d.lines||{})[name]) }; }).filter(function(p){ return !isNaN(p.v); });
    if (!pts.length){ box.innerHTML = '<div class="chart-empty">' + T("该线体暂无数据","No data") + '</div>'; return; }
    var min = 0, max = Math.max.apply(null, pts.map(function(p){ return p.v; }));
    max = Math.max(60, Math.ceil(max/20)*20);
    var iw = W - padL - padR, ih = H - padT - padB;
    function X(i){ return padL + (pts.length>1 ? i*iw/(pts.length-1) : iw/2); }
    function Y(v){ return padT + ih - (v-min)/(max-min)*ih; }
    var grid = "";
    for (var g=0; g<=4; g++){
      var gy = padT + ih*g/4, gv = max - (max-min)*g/4;
      grid += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#21262d" stroke-width="1"/>';
      grid += '<text x="'+(padL-5)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#8b949e">'+Math.round(gv)+'</text>';
    }
    var poly = pts.map(function(p,i){ return X(i).toFixed(1)+","+Y(p.v).toFixed(1); }).join(" ");
    var lineCls = pts[pts.length-1].v >= 90 ? "#3fb950" : (pts[pts.length-1].v >= 70 ? "#d29922" : "#f85149");
    var dots = pts.map(function(p,i){
      return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.6" fill="'+lineCls+'"/>'
        + '<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.v)-7).toFixed(1)+'" text-anchor="middle" font-size="7.5" fill="#c9d1d9">'+p.v.toFixed(0)+'</text>';
    }).join("");
    var labels = pts.map(function(p,i){
      var d = String(p.date).slice(5);
      return '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="7.5" fill="#8b949e">'+d+'</text>';
    }).join("");
    box.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
      + grid + '<polyline points="'+poly+'" fill="none" stroke="'+lineCls+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      + dots + labels + '</svg>';
  }

  /* ── 时间/状态 ── */
  function updText(){
    var d = new Date();
    var ds = (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0");
    $("dateTxt").textContent = ds + " " + T("更新于","upd ") + (state.updatedAt || "-");
    $("updTxt").textContent = state.lines.length ? state.lines.length + T(" 条线体"," lines") : "";
    $("srcLine").textContent = "SRC: " + (state.source || "-") + " · " + (state.mode || "");
  }
  function setConn(ok){
    var dot = $("connDot"), txt = $("connTxt");
    dot.className = "dot " + (ok?"ok":"bad");
    txt.textContent = ok ? T("已连接","LIVE") : T("连接异常","OFFLINE");
  }

  /* ── 主循环 ── */
  function loadMain(){
    fetchJSON(DATA_URL).then(function(d){
      if (d && d.lines){
        state.lines = d.lines;
        state.updatedAt = d.updatedAt || null;
        state.source = d.source || "";
        state.mode = d.mode || "";
        setConn(true);
        render();
      } else {
        setConn(false);
      }
    });
  }
  function loadAtt(){
    fetchJSON(ATT_URL).then(function(d){
      if (d && d.rows && d.rows.length){
        attData = d;
        var el = $("attSec");
        if (el && typeof renderAttendance === "function") renderAttendance();
      }
    });
  }
  function reloadLiveData(){
    // 重新注入 live-data.js 拿最新问题点/首小时/历史
    var s = document.createElement("script");
    s.src = "https://wlp713.github.io/pdtiii-live/live-data.js?v=mobile" + Date.now();
    s.onload = function(){ renderProblems(); renderFirstHour(); renderTrend(); };
    document.head.appendChild(s);
  }

  function refreshAll(){
    loadMain(); loadAtt();
    if (!window.__LIVE_DATA__ || !window.__HISTORY__) reloadLiveData();
  }

  /* ── 初始化 ── */
  $("langBtn").addEventListener("click", function(){
    zh = !zh;
    applyLang();
    render();
  });
  $("refreshBtn").addEventListener("click", function(){ reloadLiveData(); loadMain(); loadAtt(); });

  applyLang();
  loadMain();
  loadAtt();
  if (!window.__LIVE_DATA__ || !window.__HISTORY__) reloadLiveData();

  setInterval(loadMain, 60000);
  setInterval(loadAtt, 60000);
  setInterval(reloadLiveData, 600000); // 10分钟
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) refreshAll();
  });
})();
</script>
</body>
</html>
